<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시설 수리 요청 | 부산기계공업고등학교 기숙사</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html"><img src="images.png" alt="학교 로고" style="width:24px;height:24px;vertical-align:-6px;border-radius:4px"> 부산기계공업고등학교 기숙사 <span class="badge">커뮤니티</span></a>
      <nav class="main-nav">
        <a href="notice.html">공지사항</a>
        <a href="free.html">자유게시판</a>
        <a href="repair.html" class="active">시설 수리 요청</a>
        <a href="points.html">상점/벌점</a>
        <a href="index.html">석식/잔류 신청</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title">🔧 시설 수리 요청</h1>
    <p class="page-sub">고장 나거나 수리가 필요한 곳을 신고해 주세요. 처리 완료 시 상태가 [처리완료]로 변경됩니다.</p>

    <div class="board-toolbar">
      <input type="text" id="searchBox" placeholder="장소·내용 검색...">
      <select id="filterStatus" style="padding:8px;border:1px solid var(--border);border-radius:8px">
        <option value="">전체 상태</option>
        <option value="wait">대기중</option>
        <option value="done">처리완료</option>
      </select>
      <button class="btn" id="openWrite">＋ 수리 요청</button>
    </div>

    <table class="board-table">
      <thead>
        <tr>
          <th style="width:90px">상태</th>
          <th>내용</th>
          <th style="width:130px">장소</th>
          <th style="width:110px">신고자</th>
          <th style="width:110px">날짜</th>
        </tr>
      </thead>
      <tbody id="repairBody"></tbody>
    </table>
  </main>

  <div class="modal-backdrop" id="writeModal">
    <div class="modal">
      <h2>수리 요청</h2>
      <label>장소 (호실 이름 직접 입력)</label>
      <input type="text" id="wPlace" placeholder="예: 3층 302호">
      <label>신고자</label>
      <input type="text" id="wWriter" placeholder="예: 3층 302 김OO">
      <label>내용 (직접 입력)</label>
      <textarea id="wBody" placeholder="고장 내용을 직접 입력하세요. 예: 형광등이 깜빡이며 안 켜집니다."></textarea>
      <div class="modal-actions">
        <button class="btn secondary" id="cancelWrite">취소</button>
        <button class="btn" id="submitWrite">요청하기</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="viewModal">
    <div class="modal post-detail">
      <h2 id="vTitle"></h2>
      <p class="meta" id="vMeta"></p>
      <div class="body" id="vBody"></div>
      <div class="modal-actions">
        <button class="btn small" id="toggleStatus">상태 변경</button>
        <button class="btn danger small" id="deletePost">삭제</button>
        <button class="btn secondary" id="closeView">닫기</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    부산기계공업고등학교 기숙사 커뮤니티 · 문의: 기숙사 사감실 (☎ 051-719-0563)
  </footer>

  <script src="js/common.js"></script>
  <script>
    const KEY = "repairs";
    let currentId = null;

    function statusTag(s) {
      return s === "done" ? `<span class="tag repair-done">처리완료</span>` : `<span class="tag repair-wait">대기중</span>`;
    }

    function render() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      const fs = document.getElementById("filterStatus").value;
      const list = db(KEY).filter((p) =>
        (!q || (p.place + p.placeDetail + p.body).toLowerCase().includes(q)) &&
        (!fs || p.status === fs)
      );
      document.getElementById("repairBody").innerHTML =
        list.length === 0
          ? `<tr><td colspan="5" class="empty">수리 요청 내역이 없습니다.</td></tr>`
          : list.map((p) => `
            <tr data-id="${p.id}">
              <td>${statusTag(p.status)}</td>
              <td>${escapeHtml(p.body)}</td>
              <td>${escapeHtml(p.place)}${p.placeDetail ? ` <small style="color:var(--muted)">(${escapeHtml(p.placeDetail)})</small>` : ""}</td>
              <td class="writer">${escapeHtml(p.writer)}</td>
              <td class="date">${formatDate(p.createdAt)}</td>
            </tr>`).join("");
    }

    document.getElementById("repairBody").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      const p = db(KEY).find((x) => String(x.id) === tr.dataset.id);
      currentId = p.id;
      document.getElementById("vTitle").textContent = `${statusTag(p.status)} ${p.place}`;
      document.getElementById("vMeta").textContent = `${p.writer} · ${formatDate(p.createdAt)}${p.placeDetail ? " · 위치: " + p.placeDetail : ""}`;
      document.getElementById("vBody").textContent = p.body;
      document.getElementById("viewModal").classList.add("open");
    });

    document.getElementById("openWrite").onclick = () => document.getElementById("writeModal").classList.add("open");
    document.getElementById("cancelWrite").onclick = () => document.getElementById("writeModal").classList.remove("open");
    document.getElementById("closeView").onclick = () => document.getElementById("viewModal").classList.remove("open");

    document.getElementById("submitWrite").onclick = () => {
      const place = document.getElementById("wPlace").value.trim();
      const writer = document.getElementById("wWriter").value.trim();
      const body = document.getElementById("wBody").value.trim();
      if (!place || !writer || !body) return alert("장소, 신고자, 내용을 모두 입력하세요.");
      dbPush(KEY, { place: censorText(place), writer: censorText(writer), body: censorText(body), status: "wait" });
      ["wPlace", "wWriter", "wBody"].forEach((id) => (document.getElementById(id).value = ""));
      document.getElementById("writeModal").classList.remove("open");
      render();
    };

    document.getElementById("toggleStatus").onclick = () => {
      const list = db(KEY);
      const p = list.find((x) => x.id === currentId);
      p.status = p.status === "wait" ? "done" : "wait";
      dbSave(KEY, list);
      document.getElementById("viewModal").classList.remove("open");
      render();
    };

    document.getElementById("deletePost").onclick = () => {
      requireAdmin(() => {
        if (!confirm("정말 삭제하시겠습니까?")) return;
        dbSave(KEY, db(KEY).filter((x) => x.id !== currentId));
        document.getElementById("viewModal").classList.remove("open");
        render();
      });
    };

    document.getElementById("searchBox").oninput = render;
    document.getElementById("filterStatus").onchange = render;
    dbOnChange(KEY, render);
    render();
  </script>
</body>
</html>
